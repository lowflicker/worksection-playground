<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrations wall demo</title>
<link rel="stylesheet" href="wall.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9e9e7; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* the box the wall fills; the promo card around it is the site's business */
  .box { position: relative; width: min(92vw, 460px); aspect-ratio: 421 / 526; overflow: hidden; border-radius: 12px; background: #f4f2f0; }
  .box .iwall { position: absolute; inset: 0; }
  p { position: fixed; bottom: 16px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; color: #7a7a7a; }
</style>
</head>
<body>
<div class="box">
  <!-- the tiles are yours; wall.js scatters them over the grid, cloning as needed. These are Worksection's integrations; original marks from SVG Logos (Iconify), Wikimedia Commons and Simple Icons -->
  <div class="iwall" id="wall">
    <div class="iwall__sheet">
      <figure class="iwall__tile"><img src="https://api.iconify.design/logos/google-drive.svg" alt="Google Drive"></figure>
      <figure class="iwall__tile"><img src="https://upload.wikimedia.org/wikipedia/commons/6/66/Google_Docs_2020_Logo.svg" alt="Google Docs"></figure>
      <figure class="iwall__tile"><img src="https://upload.wikimedia.org/wikipedia/commons/a/ae/Google_Sheets_2020_Logo.svg" alt="Google Sheets"></figure>
      <figure class="iwall__tile"><img src="https://upload.wikimedia.org/wikipedia/commons/1/16/Google_Slides_2020_Logo.svg" alt="Google Slides"></figure>
      <figure class="iwall__tile"><img src="https://api.iconify.design/logos/slack-icon.svg" alt="Slack"></figure>
      <figure class="iwall__tile"><img src="https://api.iconify.design/logos/telegram.svg" alt="Telegram"></figure>
      <figure class="iwall__tile"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Viber_icon.svg" alt="Viber"></figure>
      <figure class="iwall__tile"><img src="https://api.iconify.design/logos/google-gmail.svg" alt="Gmail"></figure>
      <figure class="iwall__tile"><img src="https://api.iconify.design/logos/google-calendar.svg" alt="Google Calendar"></figure>
      <figure class="iwall__tile"><img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Microsoft_Office_Outlook_%282018%E2%80%932024%29.svg" alt="Outlook"></figure>
      <figure class="iwall__tile"><img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Apple_Calendar_%28iOS%29.svg" alt="Apple Calendar"></figure>
      <figure class="iwall__tile"><img src="https://api.iconify.design/logos/zapier-icon.svg" alt="Zapier"></figure>
      <figure class="iwall__tile"><img src="https://cdn.simpleicons.org/make" alt="Make"></figure>
    </div>
  </div>
</div>
<p>Веди курсором по боксу. Пробіл — пауза.</p>

<script src="wall.js"></script>
<script>
  const wall = IntegrationsWall.create(document.getElementById('wall'), { pan: 0.35 });
  document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); wall.o.paused ? wall.resume() : wall.pause(); } });
</script>
</body>
</html>
