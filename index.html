<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksection playground</title>
<link rel="stylesheet" href="playground/shell.css">
<script>
  // theme before first paint: the saved choice, else the system one
  try { document.documentElement.dataset.theme = localStorage.getItem('ws-playground:theme') ? JSON.parse(localStorage.getItem('ws-playground:theme')) : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>

<!-- the modules: exactly the files a site would load -->
<link rel="stylesheet" href="logo-wall/logo-wall.css">
<link rel="stylesheet" href="short-answer/short-answer.css">
<link rel="stylesheet" href="float-actions/float-actions.css">
<link rel="stylesheet" href="border-beam/beam.css">
<link rel="stylesheet" href="hero-section/hero.css">
</head>
<body>

<nav class="topbar">
  <span class="topbar__brand"><i class="topbar__mark"></i>Worksection playground</span>
  <div class="topbar__tabs" id="tabs"></div>
  <div class="topbar__actions">
    <button type="button" class="is-primary" id="btn-code" title="Код блоку з поточними значеннями (C)">
      <svg class="i" viewBox="0 0 16 16"><path d="M6 4 2 8l4 4M10 4l4 4-4 4"/></svg>Код<kbd>C</kbd>
    </button>
    <button type="button" class="only-desktop" id="btn-panel" title="Сховати або показати панель (\)" aria-label="Панель">
      <svg class="i" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg>
    </button>
    <button type="button" id="btn-theme" title="Світла або темна тема (T)" aria-label="Тема">
      <svg class="i" data-icon="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>
      <svg class="i" data-icon="moon" viewBox="0 0 16 16"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/></svg>
    </button>
    <button type="button" id="btn-help" title="Клавіші (?)" aria-label="Клавіші">?</button>
  </div>
</nav>

<div class="help" id="help" hidden>
  <h3>Клавіші</h3>
  <dl>
    <dt><kbd class="k">Space</kbd></dt><dd>пауза / далі</dd>
    <dt><kbd class="k">[</kbd> <kbd class="k">]</kbd></dt><dd>повільніше / швидше</dd>
    <dt><kbd class="k">G</kbd></dt><dd>сітка 8 px</dd>
    <dt><kbd class="k">L</kbd></dt><dd>центральні напрямні</dd>
    <dt><kbd class="k">Z</kbd></dt><dd>масштаб 50 / 100 / 200 %</dd>
    <dt><kbd class="k">C</kbd></dt><dd>код</dd>
    <dt><kbd class="k">\</kbd></dt><dd>сховати панель</dd>
    <dt><kbd class="k">T</kbd></dt><dd>тема</dd>
    <dt><kbd class="k">1</kbd>…<kbd class="k">5</kbd></dt><dd>вкладки</dd>
    <dt><kbd class="k">Esc</kbd></dt><dd>закрити</dd>
  </dl>
</div>

<!-- stage toolbar: one element, moved into whichever stage is on screen -->
<div class="tb" id="toolbar">
  <div class="tb__group">
    <button type="button" id="tb-play" title="Пауза / далі (Space)" aria-label="Пауза">
      <svg class="i" data-icon="pause" viewBox="0 0 16 16"><path d="M4.5 3v10M11.5 3v10"/></svg>
      <svg class="i" data-icon="play" viewBox="0 0 16 16"><path d="M4.5 3v10l8-5z"/></svg>
    </button>
  </div>
  <div class="tb__group" id="tb-rates" title="Швидкість анімацій ([ і ]). Паузи між циклами не змінюються"></div>
  <span class="tb__sep"></span>
  <span class="tb__badge" id="tb-width-badge" hidden title="Ширина рамки: тягни за краї або обери пресет"></span>
  <div class="tb__group" id="tb-width" hidden></div>
  <span class="tb__sep" id="tb-width-sep" hidden></span>
  <div class="tb__group" id="tb-zooms" title="Масштаб (Z)"></div>
  <div class="tb__group">
    <button type="button" id="tb-grid" title="Сітка 8 px (G)" aria-label="Сітка"><svg class="i" viewBox="0 0 16 16"><path d="M2 5.5h12M2 10.5h12M5.5 2v12M10.5 2v12"/></svg></button>
    <button type="button" id="tb-guides" title="Центральні напрямні (L)" aria-label="Напрямні"><svg class="i" viewBox="0 0 16 16"><path d="M8 1.5v13M1.5 8h13"/><circle cx="8" cy="8" r="2.5"/></svg></button>
  </div>
  <span class="tb__fps" id="tb-fps" title="Кадрів за секунду і час кадру">— fps</span>
</div>

<!-- one .app per module, built by the shell -->
<div id="views"></div>

<!-- code drawer, shared by every module -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__backdrop" data-drawer-close></div>
  <div class="drawer__sheet" role="dialog" aria-modal="true" aria-label="Код блоку">
    <div class="drawer__head">
      <div class="tabs" id="drawer-tabs"></div>
      <div class="drawer__actions">
        <button type="button" id="drawer-copy">Скопіювати</button>
        <button type="button" data-drawer-close aria-label="Закрити">✕</button>
      </div>
    </div>
    <pre class="code" id="drawer-code"></pre>
    <div class="drawer__foot">
      <span id="drawer-files"></span>
      <span class="legend" id="drawer-legend" hidden><i></i>відрізняється від дефолтів</span>
      <a id="drawer-readme" target="_blank" rel="noopener">README ↗</a>
    </div>
  </div>
</div>

<script src="playground/shell.js"></script>

<!-- the modules themselves, then their playground definitions -->
<script src="logo-wall/logo-wall.js"></script>
<script src="logo-wall/playground.js"></script>
<script src="short-answer/short-answer.js"></script>
<script src="short-answer/playground.js"></script>
<script src="float-actions/float-actions.js"></script>
<script src="float-actions/playground.js"></script>
<script src="border-beam/beam.js"></script>
<script src="border-beam/playground.js"></script>
<script src="dot-sphere/sphere.js"></script>
<script src="dot-sphere/playground.js"></script>
<script src="hero-section/hero.js"></script>
<script src="hero-section/playground.js"></script>
</body>
</html>
