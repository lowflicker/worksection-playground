<script src="hero.js"></script>
<script>
  new Hero('#hero', {
    view: 0,
    main: 'desktop',
    swap: true,
    hint: true,
    duration: 600,
    easing: 'cubic-bezier(.22, 1, .36, 1)',
    overshoot: 0.2,
    tilt: 3,
    lift: true,
    fade: 450,
  });
</script>

<!-- композиція для вузьких екранів (< 640 px): CSS-змінні на .hero,
     у cqw = 1 % ширини блоку. *-w/x/y: скрін як головний, *-s/tx/ty: він же як мініатюра -->
<style>
  .hero {
    --hero-stage-h: 124cqw;
    --hero-desk-w: 139cqw;   --hero-desk-x: 5cqw;
    --hero-desk-s: 1;       --hero-desk-tx: 5cqw;   --hero-desk-ty: 14cqw;
    --hero-phone-w: 52cqw;  --hero-phone-x: 43cqw;
    --hero-phone-s: 0.77;     --hero-phone-tx: 55cqw; --hero-phone-ty: 36cqw;
  }
</style>
